[platformio]
default_envs = esp32u_auxn

[env:esp32u_auxn]
platform = espressif32
board = esp32dev
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
framework = arduino, espidf
monitor_speed = 115200
extra_scripts = pre:tools/generate_config.py
lib_deps =
    symlink://../third_party/AgIsoStack-plus-plus
